      start_date: "2018-10-27"
      end_date: "2019-12-26"
      bbm_week_window: 3
      start_week_windows:
            - 1
            - 4
            - 6
      lookup_path: "Code_and_Data_repo/pipelined_intermediates/lookup/fiscal_days"
