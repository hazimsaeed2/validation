      max_depth: 15
      max_features: 0.5
      min_sample_leaf: 1000
      start_window: 1
      end_window: 3
      model: "rf"
      metrics:
            - "median_absolute_error"
            - "mean_squared_error"
            - "r2_score"
trip:
      number_of_trees: 1000
      start_window: 6
      end_window: 8
      model: "rf"
      max_depth: 15
      max_features: 0.5
      min_sample_leaf: 1000
      metrics:
            - "roc_auc_score"
            - "accuracy_score"
            - "precision_score"
            - "recall_score"
grid_search:
      number_of_trees:
            - 100
            - 500
            - 1000
      max_depths:
            - 10
            - 20
            - 30
            - "none"
      max_features:
            - 0.2
            - 0.8
            - 1.0
            - "auto"
      min_leaf_size:
            - 100
            - 1000
            - 5000
      model: "bin"
      output_path: "/Code_and_Data_repo/MODELDATA/TRIP_SPEND_MODELS/LOGS/"
predict:
      weeks_to_predict:
            - "2022-10-22"
      trip_model_date: "20191202"
      spend_model_date: "20191202"
