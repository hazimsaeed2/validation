      cube_path: "Code_and_Data_repo/CUBES/customer_cube_2019-12-02/customer_cube"
      etl_path: "etl"
      split_rate: 0.8
      sample_rate: 0.2
      base_path: "Code_and_Data_repo/MODELDATA"
