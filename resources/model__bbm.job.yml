resources:
  jobs:
    personalization__model__bbm:
      name: de_wf_ds__Personalization__model__bbm

      #---- Configs -----------------------------------------------------------------------------------------------------------------------
      max_concurrent_runs: 1  # its the equivalent of jenkins disableConcurrentBuilds()

      # queue: enabled: true  --->  This means that the job is allowed to be queued if there are no available resources to run it immediately. 
      # This ensures that the job will be executed as soon as the necessary resources become available, rather than failing or being skipped due to resource constraints.
      queue:
        enabled: true

      parameters:
        - name: environment
          default: "${bundle.target}"
        - name: catalog
          default: ${var.catalog}
        - name: run_as_date
          default: "{{job.trigger.time.iso_date}}"
  

      performance_target: PERFORMANCE_OPTIMIZED

      tags:
        Environment: ${var.env}
        Owner: DS
        Project: dbx_ds
      
      run_as:
        service_principal_name:  ${var.service_principal}
      
      budget_policy_id: ${var.budget_policy_id}    
      
      
      #---  Tasks definitions  ---------------------------------------------------------------------------------------------------------------------
      tasks:
        - task_key: bbm_propensity_input_etl
          notebook_task:
            notebook_path: ../src/model/bbm_propensity_model/bbm_propensity_model_etl.ipynb 
            base_parameters:
              run_train_or_inference: "inference"
          # this task can be run on serverless without issues

        - task_key: bbm_propensity_run_inference
          depends_on:
            - task_key: bbm_propensity_input_etl
          notebook_task:
            notebook_path: ../src/model/bbm_propensity_model/bbm_propensity_model_run.ipynb 
            base_parameters:
              weeks_to_sample: "2"
              assignment_lead_time: "6"
          existing_cluster_id: ${resources.clusters.pe_ml_cluster_1.id}
