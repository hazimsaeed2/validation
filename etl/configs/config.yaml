validation:
  s3_stat_path: 's3://memberanalytics-data-out-prod/Code_and_Data_repo/STATS/ETL/latest_stats.yaml'
  table_params:

    source:
      brand: # All DQ check are ON
        key_columns:
          - '_c0' # ARTICLE_NBR
        amnt_check_cols:
          - ' COUNT(*) '

      census_tract:
        key_columns:
          - 'MBRSHP_SID'
        amnt_check_cols:
          - ' COUNT(*) '
        CompareColAggregatesPrior:
          tolerance: 0.05
        CompareColAggregatesSource:
          tolerance: 0.05
        TestOutlierDays:
          tolerance: 0.3

      club:
        key_columns:
          - '_c0'
        amnt_check_cols:
          - ' COUNT(*) '

      coupon_clip:
        key_columns:
          - 'usercode, eventdatetime, eventtype, offerid'
        amnt_check_cols:
          - ' COUNT(*) '
        TestDuplicates:
          tolerance: 'OFF' # No Prime key
        CompareColAggregatesPrior:
          tolerance: 0.05
        CompareColAggregatesSource:
          tolerance: 0.05
        TestOutlierDays:
          tolerance: 0.3

      detail:
        key_columns:
          - 'PURCH_HDR_ID, PURCH_DTL_ID'
        amnt_check_cols:
          - ' COUNT(*) '
          - ' SUM( EXTENDED_UNIT_PRC_AMT ) '
        CompareColAggregatesPrior:
          tolerance: 0.05
        CompareColAggregatesSource:
          tolerance: 0.05
        TestOutlierDays:
